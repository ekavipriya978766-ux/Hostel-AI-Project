{% extends "base.html" %}
{% block title %}Notifications · Hostel AI{% endblock %}
{% block content %}
<h5 class="mb-3">🔔 Notifications</h5>
<div class="list-group">
    {% for n in notifications %}
    <a href="{% url 'complaints:notification_open' n.pk %}" class="list-group-item list-group-item-action">
        <div class="d-flex justify-content-between">
            <span>{{ n.message }}</span>
            <small class="text-muted">{{ n.created_at|timesince }} ago</small>
        </div>
        <span class="badge bg-light text-dark border">{{ n.get_notif_type_display }}</span>
    </a>
    {% empty %}
    <p class="text-muted">No notifications yet.</p>
    {% endfor %}
</div>
{% endblock %}
